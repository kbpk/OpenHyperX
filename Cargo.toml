[workspace]
resolver = "2"
members = [
    "apps/hyperx-gui/src-tauri",
    "crates/hyperx-app",
    "crates/hyperx-cli",
    "crates/hyperx-core",
    "crates/hyperx-devices",
    "crates/hyperx-hid",
    "crates/hyperx-protocol",
    "crates/hyperx-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.75"
clap = { version = "=4.4.18", features = ["derive"] }
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=1.0.50"
toml = "=0.8.8"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
strip = "symbols"
