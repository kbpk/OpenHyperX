name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install HID build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  linux:
    name: Linux tests, build and CLI smoke test
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install HID build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Smoke test CLI executable
        run: |
          ./target/debug/hyperx-cli --version
          ./target/debug/hyperx-cli devices

  windows:
    name: Windows tests, build and CLI smoke test
    needs: quality
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Smoke test CLI executable
        shell: pwsh
        run: |
          .\target\debug\hyperx-cli.exe --version
          .\target\debug\hyperx-cli.exe devices

  macos:
    name: macOS ${{ matrix.arch }} tests, build and CLI smoke test
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Smoke test CLI executable
        run: |
          ./target/debug/hyperx-cli --version
          ./target/debug/hyperx-cli devices
