name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install HID build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/hyperx-gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/hyperx-gui
        run: npm ci

      - name: Check frontend formatting and types
        working-directory: apps/hyperx-gui
        run: |
          npm run format:check
          npm run typecheck

      - name: Test and build frontend
        working-directory: apps/hyperx-gui
        run: |
          npm test
          npm run build

      - name: Install headless browser
        working-directory: apps/hyperx-gui
        run: npx playwright install --with-deps chromium

      - name: Test browser preview
        working-directory: apps/hyperx-gui
        run: npm run test:e2e

  linux:
    name: Linux tests, build and CLI/TUI/GUI smoke tests
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install HID and desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/hyperx-gui/package-lock.json

      - name: Build frontend assets
        working-directory: apps/hyperx-gui
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: cargo test --workspace --all-targets --locked --features hyperx-gui/desktop,hyperx-gui/custom-protocol

      - name: Build workspace
        run: cargo build --workspace --locked --features hyperx-gui/desktop,hyperx-gui/custom-protocol

      - name: Smoke test CLI, TUI and GUI executables
        run: |
          ./target/debug/hyperx-cli --version
          ./target/debug/hyperx-cli devices
          ./target/debug/hyperx-tui --demo --check
          ./target/debug/hyperx-tui --demo --render
          ./target/debug/hyperx-gui --smoke-test

  windows:
    name: Windows tests, build and CLI/TUI/GUI smoke tests
    needs: quality
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/hyperx-gui/package-lock.json

      - name: Build frontend assets
        working-directory: apps/hyperx-gui
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: cargo test --workspace --all-targets --locked --features hyperx-gui/desktop,hyperx-gui/custom-protocol

      - name: Build workspace
        run: cargo build --workspace --locked --features hyperx-gui/desktop,hyperx-gui/custom-protocol

      - name: Smoke test CLI executable
        shell: pwsh
        run: |
          .\target\debug\hyperx-cli.exe --version
          .\target\debug\hyperx-cli.exe devices
          .\target\debug\hyperx-tui.exe --demo --check
          .\target\debug\hyperx-tui.exe --demo --render
          .\target\debug\hyperx-gui.exe --smoke-test

  macos:
    name: macOS ${{ matrix.arch }} tests, build and CLI/TUI/GUI smoke tests
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify Apple desktop toolchain
        run: xcodebuild -version

      - name: Install Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/hyperx-gui/package-lock.json

      - name: Build frontend assets
        working-directory: apps/hyperx-gui
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: cargo test --workspace --all-targets --locked --features hyperx-gui/desktop,hyperx-gui/custom-protocol

      - name: Build workspace
        run: cargo build --workspace --locked --features hyperx-gui/desktop,hyperx-gui/custom-protocol

      - name: Smoke test CLI, TUI and GUI executables
        run: |
          ./target/debug/hyperx-cli --version
          ./target/debug/hyperx-cli devices
          ./target/debug/hyperx-tui --demo --check
          ./target/debug/hyperx-tui --demo --render
          ./target/debug/hyperx-gui --smoke-test
